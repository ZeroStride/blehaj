version: 2
updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: "daily"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
  versioning-strategy: "increase-if-necessary"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: "bun"
  directory: "/demo"
  schedule:
    interval: "daily"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
