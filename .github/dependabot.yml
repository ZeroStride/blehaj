version: 2
updates:
- package-ecosystem: cargo
  versioning-strategy: auto
  directory: "/"
  schedule:
    interval: "daily"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
