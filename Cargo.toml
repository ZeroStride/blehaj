[package]
name = "blehaj"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause-Clear"

[dependencies]
ble-peripheral-rust = "0.2.0"
# bluer = { git = "https://github.com/bluez/bluer.git", branch = "zbus2", features = ["bluetoothd"] }
clap = { version = "4.6.7", features = ["cargo", "derive", "env"] }
derive_more = { version = "2.1.1", features = ["debug"] }
ed25519-dalek = { version = "3.0.0", optional = true }
flate2 = "1.1.10"
hex = "0.4.3"
miette = { version = "7.6.0", features = ["fancy"] }
qrcode-generator = { version = "6.1.2", default-features = false, features = ["qr", "url"], optional = true }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh-key = { version = "0.6.7", default-features = false, optional = true  }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.28.0", features = ["v4"] }
zbus = { version = "6.0.0", default-features = false, features = ["proxy", "tokio"] }

[features]
default = ["digest", "qrcode"]
digest = ["dep:ed25519-dalek", "dep:ssh-key"]
qrcode = ["dep:qrcode-generator", "dep:url"]

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
