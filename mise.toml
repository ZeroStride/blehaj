[tools]
cargo-binstall = "latest"
"cargo:cargo-cross" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-fmt-toml" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:systemd-lsp" = { version = "latest", lazy = true } # todo lazy_bins
rust = { version = "nightly-2026-10-01", profile = "minimal", components = "rustfmt,clippy" }

[env]
CROSS_CONTAINER_UID = 0

[tasks.ci]
depends = ["lint", "test", "deny"]

[tasks.cross]
description = "Build with cross"
run = [
  "cross build --all --release --artifact-dir artifacts",
  "(cd deploy ; mise deploy)"
]

[tasks.deny]
description = "Run cargo deny checks"
run = "cargo deny check"

[tasks.lint]
description = "Lint the rust code"
run = [
  "cargo fmt-toml --check --quiet",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets",
]
wait_for = ["deny"]

[tasks.test]
description = "Launch tests"
run = [
  "cargo nextest run",
  # "cargo test --doc",
]
wait_for = ["lint"]

[tasks.rr]
description = "Copy & Run using systemd-run"
run = [
  "cross build --all --release --artifact-dir artifacts",
  "scp artifacts/unnamed {{ vars.destination_user_at_host }}:~/",
  "ssh {{ vars.destination_user_at_host }} -t 'systemd-run -p Group=netdev -p ConfigurationDirectory=unnamed -p ConfigurationDirectoryMode=0555 -p RestrictRealtime=yes -p MemoryDenyWriteExecute=yes --pipe --pty /opt/unnamed/bin/unnamed wlan0'"
]
