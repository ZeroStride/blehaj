[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
cargo-binstall = { version = "latest", lazy = true }
"cargo:cargo-cross" = { version = "latest", lazy = true, lazy_bins = ['cross'] }
"cargo:cargo-deny" = { version = "latest", lazy = true, lazy_bins = ['cargo'] }
"cargo:cargo-fmt-toml" = { version = "latest", lazy = true, lazy_bins = ['cargo'] }
"cargo:cargo-nextest" = { version = "latest", lazy = true, lazy_bins = ['cargo'] }
"cargo:systemd-lsp" = { version = "latest", lazy = true, lazy_bins = ['systemd-lsp'] }

[env]
CROSS_CONTAINER_UID = 0

[tasks.ci]
depends = ["lint", "test", "deny"]

[tasks.cross]
description = "Build with cross"
run = [
  "cross build --all --release",
  "(cd deploy ; mise deploy)"
]

[tasks.deny]
description = "Run cargo deny checks"
run = "cargo deny check"

[tasks.lint]
description = "Lint the rust code"
run = [
  "cross fmt-toml --check --quiet",
  "cross +nightly fmt --all -- --check",
  "cross clippy --workspace --all-targets",
]
wait_for = ["deny"]

[tasks.test]
description = "Launch tests"
run = [
  "cross nextest run",
  # "cargo test --doc",
]
wait_for = ["lint"]

[tasks.xmlgen]
description = "(Re)generate the generated Zbus interfaces"
run = [
  "ssh {{ vars.destination_user_at_host }} -t 'curl -s https://raw.githubusercontent.com/NetworkManager/NetworkManager/refs/heads/main/introspection/org.freedesktop.NetworkManager.xml | zbus-xmlgen -o - file -' > {{ config_root }}/src/network_manager/generated/network_manager.rs"
]

# Change --quiet to --pipe when copy/pasting it
[tasks.rr]
description = "Copy & Run using systemd-run"
run = [
  "cross build --all --release ",
  "scp target/aarch64-unknown-linux-gnu/release/blehaj {{ vars.destination_user_at_host }}:~/",
  "ssh {{ vars.destination_user_at_host }} -t 'sudo systemd-run -p Group=netdev -p LoadCredentialEncrypted=unnamed_ed25519 -p RestrictRealtime=yes -p MemoryDenyWriteExecute=yes -p NoNewPrivileges=yes -p ProtectSystem=strict -p ProtectHome=read-only -p PrivateTmp=yes -p RemoveIPC=yes --quiet --pty --send-sighup ~/blehaj --signing-key \"\\${CREDENTIALS_DIRECTORY}/unnamed_ed25519\" --no-journald --qr-code-url-prefix \"https://blehaj.org/\" --verifying-key \"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM+zU6RvlX7x9bFR66jCLakmCCWyl0PcYvmOqqVrgp34\" --service-uuid cadf5f5e-4549-448d-a12f-f88cba002ec1 wlan0'"
]
